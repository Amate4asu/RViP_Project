databaseChangeLog:
  - changeSet:
      id: 001-create-visitors-table
      author: student
      changes:
        - createTable:
            tableName: visitors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_visitors
                    nullable: false

              - column:
                  name: full_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: phone
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: email
                  type: VARCHAR(254)

              - column:
                  name: registered_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: terminated_at
                  type: TIMESTAMP

              - column:
                  name: has_disk
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
